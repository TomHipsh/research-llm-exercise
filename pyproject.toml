[project]
name = "research-llm-exercise"
version = "0.1.0"
description = "CLI chatbot for asking questions about a local Git repository."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "azure-identity>=1.25.1,<2.0.0",
    "chromadb>=1.3.5,<2.0.0",
    "gitignore-parser>=0.1.13,<0.2.0",
    "openai>=2.8.1,<3.0.0",
    "pydantic>=2.13.4,<3.0.0",
    "python-dotenv>=1.2.1,<2.0.0",
    "typer>=0.20.0,<0.21.0",
]

[project.scripts]
chat = "repo_chat.cli:main"

[tool.poetry]
packages = [
    { include = "api" },
    { include = "repo_chat" },
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
